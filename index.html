<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f151b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
</style>
<title>GTM Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Concept: a ledger. Totals strip first, category tabs under it, dense rows with aligned amounts. Teal for actions, gold reserved for the gold balance. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --fg:#13202b; --muted:#5b6b78; --line:#d6dde3;
  --accent:#0f6f66; --accent-fg:#ffffff; --gold:#8a6200; --danger:#b3261e; --chip:#e0e7ec;
  --display:"Chakra Petch","Trebuchet MS",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f151b; --surface:#17202a; --fg:#e6edf2; --muted:#8fa1af; --line:#26333f;
    --accent:#3dbfae; --accent-fg:#06211d; --gold:#e5b94e; --danger:#ff8a80; --chip:#202c37;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#17202a; --fg:#e6edf2; --muted:#8fa1af; --line:#26333f;
  --accent:#3dbfae; --accent-fg:#06211d; --gold:#e5b94e; --danger:#ff8a80; --chip:#202c37;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{max-width:720px;margin-inline:auto;padding-block:16px 96px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:700;font-size:1.6rem;letter-spacing:.01em;margin:0;text-wrap:balance}
.sub{margin:2px 0 0;color:var(--muted);font-size:.82rem}
.ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;color:var(--fg)}
.ghost:hover{background:var(--chip)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-bottom:8px;margin-top:8px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-block:8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--chip);border:1px solid transparent;border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-fg)}
.chip.add{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.quick{display:flex;gap:8px;margin-bottom:8px}
.quick input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px}
.quick .primary{padding:10px 14px}
.search input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-block:12px 4px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.kpi .l{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--mono);font-size:1.45rem;font-variant-numeric:tabular-nums;margin-top:2px;overflow-wrap:anywhere}
.kpi .s{font-size:.78rem;color:var(--muted);margin-top:2px}
.kpi.gold .v{color:var(--gold)}
.kpi.gift .v{color:var(--accent)}
h2{font-family:var(--display);font-size:1.05rem;font-weight:600;margin:22px 0 4px}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:18px}
.head h2{margin:0}
.totals{font-family:var(--mono);font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.hint{font-size:.82rem;color:var(--muted);margin:4px 0 0}
.list{margin-top:6px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:12px 2px;cursor:pointer}
.row:hover{background:color-mix(in srgb,var(--chip) 55%,transparent)}
.row .main{display:flex;flex-direction:column;min-width:0}
.row .name{font-weight:600;overflow-wrap:anywhere}
.row .meta{font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.row .note{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere;margin-top:2px}
.row .amt{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:1px}
.row .amt.gold,.gold-text{color:var(--gold)}
.cat-row .meta{font-family:var(--mono)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:20px 16px;margin-top:12px;color:var(--muted)}
.empty strong{display:block;color:var(--fg);font-family:var(--display);font-size:1.05rem;margin-bottom:4px}
.primary{background:var(--accent);color:var(--accent-fg);border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer}
.primary:disabled{opacity:.5;cursor:default}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 6px 18px rgba(0,0,0,.28);padding:13px 20px;border-radius:999px;z-index:6}
.danger{color:var(--danger);border-color:var(--danger)}
#sheet-root{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.sheet{position:relative;width:100%;max-width:560px;max-height:92dvh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-family:var(--display);font-size:1.2rem;margin:0 0 12px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label,.field .lab{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:16px}
.field textarea{min-height:76px;resize:vertical}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.seg label{flex:1;position:relative;text-transform:none;letter-spacing:0;font-size:1rem;color:var(--fg)}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:block;text-align:center;padding:10px;cursor:pointer}
.seg input:checked+span{background:var(--accent);color:var(--accent-fg);font-weight:600}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:-2px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.err{color:var(--danger);font-size:.84rem;min-height:1.2em;margin:0 0 6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;max-width:calc(100% - 32px);font-size:.9rem}
h1,h2,h3,.sub,.chip,.ghost,.primary,.hint,.empty,.empty strong,.kpi .s,.kpi .v,.totals,.row .name,.row .amt,.cat-row .meta,.seg span,.err,.toast{text-transform:capitalize}
input::placeholder,textarea::placeholder{text-transform:capitalize}
@media (prefers-reduced-motion:no-preference){.chip,.row,.ghost{transition:background .12s}}
.acts{display:flex;gap:8px;flex:none}
</style></head><body>


<div class="app">
  <header class="top">
    <div>
      <h1>GTM Ledger</h1>
      <p class="sub" id="status">Loading your entries</p>
    </div>
    <div class="acts"><button id="backup" class="ghost">Backup</button><button id="restore" class="ghost">Restore</button><input id="restore-file" type="file" accept="application/json,.json" hidden></div>
  </header>
  <div class="bar">
    <div id="tabs" class="tabs" role="tablist" aria-label="Categories"></div>
    <form id="quick" class="quick" autocomplete="off"><label class="sr" for="ql">Quick log</label><input id="ql" type="text" enterkeyhint="done" maxlength="200" placeholder="Quick log: I bought a diamond sword for 50M"><button class="primary" type="submit">Log</button></form>
    <div class="search"><label class="sr" for="q">Search</label><input id="q" type="search" placeholder="Search everything" autocomplete="off"></div>
  </div>
  <main id="content"></main>
</div>
<button id="fab" class="primary fab">+ Add</button>
<div id="sheet-root" hidden><div class="scrim" id="scrim"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(function(){
var BASE=[
 {id:'purchases',label:'Purchases',nameLabel:'Item',amount:true,amountLabel:'Price',whereLabel:'Bought from',empty:'Log what you buy with the price and where you got it, for example Iron Chestplate, $4,500, Market stall.'},
 {id:'inventory',label:'Inventory',hasQty:true,nameLabel:'Item',amount:false,whereLabel:'Bought from',hint:'Items you own. Quick log adds an item when you buy it and removes it when you sell it.',empty:'Items you buy with the quick log show up here. You can also add things you already own with the Add button.'},
 {id:'sales',label:'Sales',nameLabel:'Item sold',amount:true,amountLabel:'Sold for',whereLabel:'Sold to',empty:'Log what you sell with the price, for example Diamond Sword, $80M, Steve. Try the quick log: I sold my sword for 80M.'},
 {id:'houses',label:'Houses',nameLabel:'House',amount:true,amountLabel:'Size in gold',fixedUnit:'gold',hasOwner:true,hasPaid:true,whereLabel:'Location or coords',hint:'Gold sets the size of a house, for example a 1000 gold house.',empty:'Add each house you own with its size in gold and where it is.'},
 {id:'money',label:'Balances',nameLabel:'Wallet',amount:true,amountLabel:'Balance',whereLabel:'Where it is held',empty:'Add a row for each place you hold cash, gold or giftcards, such as Wallet, Bank or Chest.'},
 {id:'accounts',label:'Accounts',nameLabel:'Service',amount:false,whereLabel:'Username',empty:'List the services you use with the username and a note. Passwords do not belong here.',hint:'Usernames and notes only. Do not store passwords in this page.'}
];
var state={entries:[],cats:[],tab:'overview',q:'',ready:false,mode:'pending'};
var db=null;
var LS='gtm-ledger-v1';

function $(s){return document.querySelector(s)}
function el(tag,attrs){
  var n=document.createElement(tag);
  if(attrs){Object.keys(attrs).forEach(function(k){
    var v=attrs[k];
    if(k==='class')n.className=v;
    else if(k==='text')n.textContent=v;
    else if(k.indexOf('on')===0)n.addEventListener(k.slice(2),v);
    else if(v===true)n.setAttribute(k,'');
    else if(v!==false&&v!=null)n.setAttribute(k,v);
  })}
  for(var i=2;i<arguments.length;i++){
    var kids=[].concat(arguments[i]);
    kids.forEach(function(c){if(c==null||c===false)return;n.append(c.nodeType?c:document.createTextNode(c))});
  }
  return n;
}
function allCats(){return BASE.concat(state.cats)}
function getCat(id){return allCats().filter(function(c){return c.id===id})[0]}
function fmtNum(n){return Number(n).toLocaleString('en-US',{maximumFractionDigits:2})}
function short(n){
  n=Number(n);var a=Math.abs(n);
  if(!isFinite(n)||a<10000)return fmtNum(n);
  var U=[[1e3,'K'],[1e6,'M'],[1e9,'B'],[1e12,'T']],i=0;
  while(i<U.length-1&&a>=U[i+1][0])i++;
  var v;
  for(;;){
    v=a/U[i][0];
    var d=v<10?3:v<100?2:1;
    v=parseFloat(v.toFixed(d));
    if(v>=1000&&i<U.length-1){i++;continue}
    break;
  }
  return (n<0?'-':'')+v.toLocaleString('en-US')+U[i][1];
}
function money(n){return '$'+short(n)}
function goldTxt(n){return short(n)+' gold'}
function giftTxt(n){return short(n)+' giftcards'}
function gcTxt(n){return short(n)+' Gc'}
function unitTxt(u,n){return u==='gold'?goldTxt(n):u==='giftcards'?giftTxt(n):money(n)}
function unitOf(e){var c=getCat(e.cat);return (c&&c.fixedUnit)||e.unit||'$'}
function amtText(e){
  var c=getCat(e.cat);
  if(!c||!c.amount||e.amount==null||e.amount==='')return '';
  return unitTxt(unitOf(e),e.amount);
}
function sum(list,unit){return list.reduce(function(t,e){return t+(unitOf(e)===unit&&typeof e.amount==='number'?e.amount:0)},0)}
function fdate(s){
  if(!s)return '';
  var d=new Date(s+'T00:00:00');if(isNaN(d))return '';
  var o={month:'short',day:'numeric'};
  if(d.getFullYear()!==new Date().getFullYear())o.year='numeric';
  return d.toLocaleDateString('en-US',o);
}
function today(){return new Date().toLocaleDateString('en-CA')}
function sorted(list){
  return list.slice().sort(function(a,b){
    var x=(b.date||'').localeCompare(a.date||'');
    return x||((b.ts||0)-(a.ts||0));
  });
}
function newId(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
var toastTimer;
function toast(msg){
  var t=$('#toast');t.textContent=msg;t.hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true},3200);
}

/* ---------- storage ---------- */
function persistLocal(){
  try{localStorage.setItem(LS,JSON.stringify({entries:state.entries,cats:state.cats}))}
  catch(e){toast('Could not save in this browser.')}
}
function loadLocal(){
  try{
    var d=JSON.parse(localStorage.getItem(LS)||'null');
    if(d){state.entries=d.entries||[];state.cats=d.cats||[]}
  }catch(e){}
}
function dbFail(e){
  var code=e&&e.code;
  toast(code==='quota_exceeded'?'Storage is full. Delete some entries first.':'Could not save. Try again in a moment.');
}
function saveEntry(e){
  var body={cat:e.cat,name:e.name,amount:e.amount,unit:e.unit,where:e.where,note:e.note,date:e.date,ts:e.ts,qty:(typeof e.qty==='number'&&e.qty>0)?e.qty:null,ownerId:e.ownerId||null,paidText:e.paidText||'',paidWith:e.paidWith||'cash'};
  if(state.mode==='db'){
    return db.collection('entries').doc(e.id).set(body).then(function(){return true},function(x){dbFail(x);return false});
  }
  var i=state.entries.findIndex(function(x){return x.id===e.id});
  var full=Object.assign({id:e.id},body);
  if(i>=0)state.entries[i]=full;else state.entries.push(full);
  persistLocal();render();
  return Promise.resolve(true);
}
function removeEntry(id){
  if(state.mode==='db')return db.collection('entries').doc(id).delete().then(function(){return true},function(x){dbFail(x);return false});
  state.entries=state.entries.filter(function(x){return x.id!==id});
  persistLocal();render();
  return Promise.resolve(true);
}
function saveCats(){
  if(state.mode==='db')return db.doc('meta/config').set({cats:state.cats}).catch(dbFail);
  persistLocal();render();
  return Promise.resolve();
}

/* ---------- rendering ---------- */
function setTab(id){
  state.tab=id;
  try{localStorage.setItem('gtm-ledger-tab',id)}catch(e){}
  render();window.scrollTo(0,0);
}
function renderTabs(){
  var box=$('#tabs');box.replaceChildren();
  [{id:'overview',label:'Overview'}].concat(allCats()).forEach(function(c){
    box.append(el('button',{class:'chip'+(state.tab===c.id?' on':''),role:'tab','aria-selected':String(state.tab===c.id),onclick:function(){setTab(c.id)},text:c.label}));
  });
  box.append(el('button',{class:'chip add',onclick:openCatSheet,text:'+ Category'}));
}
function ownerName(e){
  if(!e.ownerId)return '';
  var a=state.entries.filter(function(x){return x.id===e.ownerId&&x.cat==='accounts'})[0];
  return a?(a.name+(a.where?' ('+a.where+')':'')):'';
}
function paidDisplay(e){
  var t=(e.paidText!=null&&e.paidText!=='')?e.paidText:(typeof e.paid==='number'?(e.paidUnit==='gold'?goldTxt(e.paid):money(e.paid)):'');
  if(!t)return '';
  return 'Paid '+t+(e.paidWith==='giftcards'?' in Giftcards':'');
}
function rowFor(e,showCat){
  var c=getCat(e.cat)||{label:'Other'};
  var amt=amtText(e);
  var own=ownerName(e);
  var paid=c.hasPaid?paidDisplay(e):'';
  var meta=[showCat?c.label:null,e.where,own?('Owner '+own):null,paid,fdate(e.date)].filter(Boolean).join(' · ');
  return el('button',{class:'row',onclick:function(){openEntry(e)}},
    el('span',{class:'main'},
      el('span',{class:'name',text:e.name+((typeof e.qty==='number'&&e.qty>1)?' \u00d7'+e.qty:'')}),
      meta?el('span',{class:'meta',text:meta}):null,
      e.note?el('span',{class:'note',text:e.note}):null),
    amt?el('span',{class:'amt'+(unitOf(e)==='gold'?' gold':unitOf(e)==='giftcards'?' gift':''),text:amt}):null);
}
function matches(e){
  var q=state.q.trim().toLowerCase();
  if(!q)return true;
  var c=getCat(e.cat);
  return [e.name,e.where,e.note,c&&c.label].join(' ').toLowerCase().indexOf(q)>=0;
}
function kpi(label,value,sub,cls){
  return el('div',{class:'kpi'+(cls?' '+cls:'')},el('div',{class:'l',text:label}),el('div',{class:'v',text:value}),sub?el('div',{class:'s',text:sub}):null);
}
function totalsLine(list){
  list=list.filter(function(e){var c=getCat(e.cat);return c&&c.amount});
  var d=sum(list,'$'),g=sum(list,'gold'),gc=sum(list,'giftcards'),parts=[];
  if(d)parts.push(money(d));
  if(g)parts.push(goldTxt(g));
  if(gc)parts.push(gcTxt(gc));
  return parts.join('  +  ');
}
function renderOverview(box){
  var q=state.q.trim();
  if(q){
    var res=sorted(state.entries.filter(matches));
    box.append(el('div',{class:'head'},el('h2',{text:'Results'}),el('span',{class:'totals',text:res.length+' found'})));
    if(!res.length)box.append(el('div',{class:'empty'},el('strong',{text:'Nothing matches'}),'Try a different word, or check the spelling.'));
    else box.append(el('div',{class:'list'},res.map(function(e){return rowFor(e,true)})));
    return;
  }
  var E=state.entries;
  var by=function(id){return E.filter(function(e){return e.cat===id})};
  var mon=by('money'),hou=by('houses'),pur=by('purchases'),acc=by('accounts'),sal=by('sales');
  var spentG=sum(pur,'gold'),spentC=sum(pur,'giftcards');
  var spentX=[spentG?goldTxt(spentG):'',spentC?gcTxt(spentC):''].filter(Boolean).join(' and ');
  box.append(el('div',{class:'kpis'},
    kpi('Cash',money(sum(mon,'$')),mon.length+(mon.length===1?' balance':' balances')),
    kpi('Gold',goldTxt(sum(mon,'gold')),'across all balances','gold'),
    kpi('Giftcards',gcTxt(sum(mon,'giftcards')),'across all balances','gift'),
    kpi('Houses',String(hou.length),hou.length?('Total size '+goldTxt(sum(hou,'gold'))):'None logged'),
    kpi('Spent',money(sum(pur,'$')),spentX?('plus '+spentX):pur.length+(pur.length===1?' purchase':' purchases')),
    kpi('Sold',money(sum(sal,'$')),(function(){var x=[sum(sal,'gold')?goldTxt(sum(sal,'gold')):'',sum(sal,'giftcards')?gcTxt(sum(sal,'giftcards')):''].filter(Boolean).join(' and ');return x?('plus '+x):sal.length+(sal.length===1?' sale':' sales')})()),
    kpi('Accounts',String(acc.length),'usernames and notes')));
  if(!E.length){
    box.append(el('div',{class:'empty'},el('strong',{text:'Nothing logged yet'}),
      'Start with your balances under Balances, then add houses, purchases and accounts. Everything here saves automatically.',
      el('div',{class:'actions'},el('button',{class:'primary',onclick:function(){openEntry(null,'money')},text:'Add a balance'}))));
    return;
  }
  box.append(el('h2',{text:'By category'}));
  box.append(el('div',{class:'list'},allCats().map(function(c){
    var l=by(c.id);
    return el('button',{class:'row cat-row',onclick:function(){setTab(c.id)}},
      el('span',{class:'main'},el('span',{class:'name',text:c.label}),el('span',{class:'meta',text:l.length+(l.length===1?' entry':' entries')})),
      el('span',{class:'amt',text:totalsLine(l)}));
  })));
  box.append(el('h2',{text:'Recent'}));
  box.append(el('div',{class:'list'},sorted(E).slice(0,6).map(function(e){return rowFor(e,true)})));
}
function renderCategory(box,c){
  var list=sorted(state.entries.filter(function(e){return e.cat===c.id}));
  var shown=list.filter(matches);
  box.append(el('div',{class:'head'},el('h2',{text:c.label}),el('span',{class:'totals',text:c.id==='inventory'?(function(){var n=list.reduce(function(t,e){return t+(e.qty||1)},0);return n+(n===1?' item':' items')})():totalsLine(list)})));
  if(c.hint)box.append(el('p',{class:'hint',text:c.hint}));

/* ---------- quick log ---------- */
var MULT={k:1e3,thousand:1e3,m:1e6,mil:1e6,million:1e6,b:1e9,billion:1e9,t:1e12,trillion:1e12};
function parseLog(raw){
  var t=String(raw||'').replace(/\s+/g,' ').trim();
  var cat='purchases';
  if(/^(?:i\s+)?(?:just\s+|recently\s+)?(?:sold|sell|selling)\b/i.test(t))cat='sales';
  t=t.replace(/^(?:i\s+)?(?:just\s+|recently\s+)?(?:bought|purchased|got|picked up|paid for|buying|buy|spent|sold off|sold|selling|sell)\s+/i,'');
  var giftFlag=false;
  var gm=t.match(/\s+(?:in|with|using|via|into)\s+gift\s?cards?\b/i);
  if(gm){giftFlag=true;t=t.slice(0,gm.index)+t.slice(gm.index+gm[0].length)}
  var acct='';
  var am=t.match(/\s+(?:using|with|via|into)\s+(?:my\s+)?(.+)$/i);
  if(am){acct=am[1].trim();t=t.slice(0,am.index)}
  var where='';
  var fm=t.match(cat==='sales'?/\s+to\s+(.+)$/i:/\s+from\s+(.+)$/i);
  if(fm){where=fm[1].trim();t=t.slice(0,fm.index)}
  var re=/(\$)?\s*(\d[\d,]*(?:\.\d+)?|\.\d+)\s*(thousand|million|billion|trillion|mil|k|m|b|t)?(?![a-z0-9])\s*(gold|gift\s?cards?|dollars?|bucks|\$)?/ig;
  var name='',m=null,idx=t.toLowerCase().lastIndexOf(' for ');
  if(idx>=0){
    name=t.slice(0,idx);re.lastIndex=0;m=re.exec(t.slice(idx+5));
  }else{
    var all=[],x;re.lastIndex=0;
    while((x=re.exec(t)))all.push(x);
    var strong=all.filter(function(y){return y[1]||y[3]||y[4]});
    m=(strong.length?strong:all).slice(-1)[0]||null;
    if(m)name=(t.slice(0,m.index)+' '+t.slice(m.index+m[0].length));
  }
  if(!m)return null;
  var val=parseFloat(m[2].replace(/,/g,''));
  if(m[3])val*=MULT[m[3].toLowerCase()];
  if(!isFinite(val))return null;
  var each=/\b(?:each|apiece)\b/i.test(t);
  name=name.replace(/\b(?:each|apiece)\b/ig,' ').replace(/\s+/g,' ').trim().replace(/^(?:a|an|the|some|my|new)\s+/i,'');
  var qty=1,qm=name.match(/^(?:(\d+)\s*x?|x\s*(\d+)|(one|two|three|four|five|six|seven|eight|nine|ten))\s+(.+)$/i);
  if(qm){
    var W={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10};
    var qn=qm[1]?parseInt(qm[1],10):qm[2]?parseInt(qm[2],10):W[qm[3].toLowerCase()];
    if(qn>=1&&qn<=99999){qty=qn;name=qm[4]}
  }
  if(each)val*=qty;
  name=name.replace(/[\s,:;-]+$/,'').replace(/\s+(?:for|at|and)$/i,'').trim();
  if(!name)return null;
  var w4=(m[4]||'').toLowerCase().replace(/\s/g,'');
  var unit=(giftFlag||/^giftcards?$/.test(w4))?'giftcards':w4==='gold'?'gold':'$';
  return {cat:cat,name:name,qty:qty,amount:Math.round(val*100)/100,unit:unit,where:where,acct:acct};
}
var dlApi=null;
function norm(n){return String(n||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim().replace(/^(?:my|a|an|the|some)\s+/,'').replace(/(?<=[a-z]{3})s$/,'')}
function exportList(list){
  var groups={},order=[];
  var total=0;
  list.forEach(function(e){var k=norm(e.name),q=e.qty||1;total+=q;if(!groups[k]){groups[k]={name:e.name,n:0};order.push(k)}groups[k].n+=q});
  order.sort(function(x,y){return groups[x].name.localeCompare(groups[y].name)});
  var lines=['GTM INVENTORY','Saved '+new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}),'',''];
  order.forEach(function(k){var g=groups[k];lines.push('- '+g.name+(g.n>1?' x'+g.n:''))});
  lines.push('','Total items: '+total);
  var text=lines.join('\n'),name='gtm-inventory-'+today()+'.txt';
  if(typeof saveFile==='function'){saveFile(name,text,'text/plain');toast('List downloaded')}
  else if(dlApi)dlApi.save({filename:name,data:text}).then(function(){toast('List saved')},function(e){if(!e||e.code!=='declined')toast('Could not save the list.')});
  else toast('Downloads are not available here.');
}
function pickBalance(r){
  var list=state.entries.filter(function(e){return e.cat==='money'&&unitOf(e)===r.unit});
  var want=(r.acct||r.where||'').toLowerCase().replace(/^my\s+/,'');
  if(want){
    var hit=list.filter(function(e){return e.name.toLowerCase()===want})[0];
    if(hit){if(hit.name.toLowerCase()===(r.where||'').toLowerCase())r.where='';return hit}
  }
  list.sort(function(a,b){return (b.amount||0)-(a.amount||0)});
  return list[0]||null;
}
$('#quick').addEventListener('submit',function(ev){
  ev.preventDefault();
  var inp=$('#ql'),r=parseLog(inp.value);
  if(!r){toast('Could not read that. Try: I sold 2 swords for 50M');return}
  if(r.unit==='gold'){toast('Gold can not be logged here. Use cash or giftcards.');return}
  var sell=r.cat==='sales',fmt=function(n){return unitTxt(r.unit,n)};
  var bal=pickBalance(r),k=norm(r.name),ops=[];
  var mine=state.entries.filter(function(e){return e.cat==='inventory'&&norm(e.name)===k}).sort(function(a,b){return (a.ts||0)-(b.ts||0)});
  if(sell){
    var have=mine.reduce(function(t,e){return t+(e.qty||1)},0);
    if(!have){toast('You do not own '+r.name+'. Add it under Inventory first.');return}
    if(have<r.qty){toast('You only own '+have+' '+r.name+'.');return}
    var need=r.qty;
    mine.forEach(function(e){
      if(need<=0)return;
      var q=e.qty||1,take=Math.min(q,need);need-=take;
      if(take>=q)ops.push(function(){return removeEntry(e.id)});
      else ops.push(function(){return saveEntry(Object.assign({},e,{qty:q-take,amount:e.amount==null?null:Math.round(e.amount*(q-take)/q*100)/100}))});
    });
  }else{
    var bh=bal?(bal.amount||0):0;
    if(!bal){toast('You have no '+(r.unit==='gold'?'gold':r.unit==='giftcards'?'giftcard':'cash')+' balance yet. Add one under Balances first.');return}
    if(bh<r.amount){toast('Not enough. '+bal.name+' has '+fmt(bh)+' but this costs '+fmt(r.amount)+'.');return}
  }
  var isNew=!bal;
  if(isNew)bal={id:newId('e'),cat:'money',name:r.unit==='giftcards'?'Giftcards':'Wallet',amount:0,unit:r.unit,where:'',note:'',date:today(),ts:Date.now()};
  var next=Math.round(((bal.amount||0)+(sell?1:-1)*r.amount)*100)/100;
  var upd=Object.assign({},bal,{amount:next});
  var now=Date.now(),ok=true;
  function step(f){return Promise.resolve(ok).then(function(o){if(!o)return false;return f()}).then(function(v){if(v===false)ok=false;return ok})}
  step(function(){return saveEntry({id:newId('e'),cat:r.cat,name:r.name,qty:r.qty,amount:r.amount,unit:r.unit,where:r.where,note:'',date:today(),ts:now})})
  .then(function(){return step(function(){return saveEntry(upd)})})
  .then(function(){
    if(sell){
      var chain=Promise.resolve(ok);
      ops.forEach(function(f){chain=chain.then(function(){return step(f)})});
      return chain;
    }
    return step(function(){
      var t=mine.filter(function(e){return unitOf(e)===r.unit})[0];
      if(t)return saveEntry(Object.assign({},t,{qty:(t.qty||1)+r.qty,amount:Math.round(((t.amount||0)+r.amount)*100)/100}));
      return saveEntry({id:newId('e'),cat:'inventory',name:r.name,qty:r.qty,amount:r.amount,unit:r.unit,where:r.where,note:'',date:today(),ts:now});
    });
  })
  .then(function(o){
    if(!o)return;
    inp.value='';
    toast((sell?'Sold ':'Bought ')+(r.qty>1?r.qty+' ':'')+r.name+'. '+bal.name+' is now '+fmt(next));
  });
});

/* ---------- standalone: backup, restore, offline ---------- */
function saveFile(name,text,type){
  var blob=new Blob([text],{type:type||'application/json'});
  var u=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=u;a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(u)},3000);
}
$('#backup').addEventListener('click',function(){

  toast('Backup downloaded');
});
$('#restore').addEventListener('click',function(){$('#restore-file').click()});
$('#restore-file').addEventListener('change',function(ev){
  var f=ev.target.files&&ev.target.files[0];
  if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.entries))throw new Error('bad');
      var known={};state.entries.forEach(function(e,i){known[e.id]=i});
      var added=0;
      d.entries.forEach(function(e){
        if(!e||typeof e.name!=='string'||typeof e.cat!=='string')return;
        var item={id:e.id||newId('e'),cat:e.cat,name:e.name,amount:typeof e.amount==='number'?e.amount:null,unit:(e.unit==='gold'||e.unit==='giftcards')?e.unit:'$',ownerId:e.ownerId||null,paid:typeof e.paid==='number'?e.paid:null,paidUnit:e.paidUnit==='gold'?'gold':'$',qty:(typeof e.qty==='number'&&e.qty>0)?e.qty:null,paidText:typeof e.paidText==='string'?e.paidText:'',paidWith:e.paidWith==='giftcards'?'giftcards':'cash',where:e.where||'',note:e.note||'',date:e.date||'',ts:e.ts||Date.now()};
        if(known[item.id]!=null)state.entries[known[item.id]]=item;
        else{state.entries.push(item);known[item.id]=state.entries.length-1;added++}
      });
      (d.customCategories||[]).forEach(function(c){
        if(c&&c.id&&c.label&&!state.cats.some(function(x){return x.id===c.id}))state.cats.push(c);
      });
      persistLocal();render();
      toast('Restored '+d.entries.length+(d.entries.length===1?' entry':' entries'));
    }catch(err){toast('That file is not a GTM Ledger backup.')}
    ev.target.value='';
  };
  r.readAsText(f);
});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
})();
</script>
